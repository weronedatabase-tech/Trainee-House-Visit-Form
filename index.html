<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Standalone Date Rolodex</title>
<style>
    /* --- 1. CORE VARIABLES (Adapt these to your new app's theme) --- */
    :root {
        --bg-color: #f4f7f6;
        --text-color: #333333;
        --card-bg: #ffffff;
        --card-border: #e0e0e0;
        --primary-color: #4a90e2;
        --success-color: #4CAF50;
        --error-color: #F44336;
    }

    body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }

    /* --- 2. ROLODEX MODAL & SHEET STYLES --- */
    @keyframes popIn {
        0% { transform: translateY(100%); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }

    .bottom-sheet-backdrop {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
        background: rgba(0,0,0,0.6); z-index: 9999; display: none; opacity: 0; transition: opacity 0.3s;
    }
    .bottom-sheet-backdrop.show { display: block; opacity: 1; }

    .rolodex-sheet {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 320px;
        background: var(--card-bg); border-top-left-radius: 30px; border-top-right-radius: 30px;
        box-shadow: 0 -10px 25px rgba(0,0,0,0.2); z-index: 10000;
        display: none; flex-direction: column; overflow: hidden;
    }
    .rolodex-sheet.show { display: flex; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    .rolodex-header {
        display: flex; justify-content: space-between; align-items: center; width: 100%;
        padding: 15px 20px; box-sizing: border-box; border-bottom: 1px solid var(--card-border);
        font-size: 1.2rem; font-weight: bold; background: var(--card-bg); z-index: 10;
    }
    .rolodex-cancel { color: var(--error-color); cursor: pointer; }
    .rolodex-title { color: var(--text-color); font-size: 1.3rem; }
    .rolodex-save { color: var(--success-color); cursor: pointer; }

    /* --- 3. ROLODEX PHYSICS TRACK STYLES --- */
    .rolodex-body { display: flex; width: 100%; height: 220px; position: relative; background: var(--bg-color); overflow: hidden; }

    .rolodex-highlight {
        position: absolute; top: 50%; left: 0; width: 100%; height: 44px; transform: translateY(-50%);
        background: rgba(74, 144, 226, 0.15); border-top: 2px solid var(--primary-color); 
        border-bottom: 2px solid var(--primary-color); pointer-events: none; z-index: 2;
    }

    .rolodex-col-wrapper { position: relative; display: flex; align-items: center; justify-content: center; height: 100%; }
    .rolodex-col-wrapper:not(:last-child)::after {
        content: ''; position: absolute; top: 15%; bottom: 15%; right: 0; width: 1px;
        background-color: var(--card-border); z-index: 5;
    }

    .rolodex-col {
        flex: 1; position: relative; z-index: 1; width: 100%; height: 100%;
        touch-action: none; cursor: grab; /* JS Touch Engine handles drag */
    }
    .rolodex-col:active { cursor: grabbing; }

    .rolodex-col-inner {
        padding: 88px 0; margin: 0; display: flex; flex-direction: column; width: 100%;
    }

    .rolodex-item {
        height: 44px; display: flex; align-items: center; justify-content: center;
        color: var(--text-color); opacity: 0.3; transition: opacity 0.2s ease, font-size 0.2s ease;
        user-select: none; white-space: nowrap; font-size: 1.2rem; flex-shrink: 0;
    }
    .rolodex-item.active { 
        opacity: 1; font-weight: 900; color: var(--primary-color); 
        font-size: clamp(1.1rem, 4.5vw, 1.5rem); 
    }

    /* Simple button to trigger demo */
    .demo-btn { padding: 15px 20px; font-size: 1.2rem; background: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

    <h2>Date Picker Demo</h2>
    <button class="demo-btn" onclick="openMyDatePicker()">Select a Date</button>
    <h3 style="margin-top: 20px;">Selected Date: <span id="date-output" style="color: var(--primary-color);">None</span></h3>

<script>
// =========================================================
// 1. DATA GENERATORS (Days, Months, Years)
// =========================================================
const RoloGen = {
    days31: () => Array.from({length:31}, (_,i) => ({ value: i+1, label: (i+1).toString() })),
    monthsSpec: () =>[
        {value:1, label:'1. January (Jan)'}, {value:2, label:'2. February (Feb)'}, {value:3, label:'3. March (Mar)'},
        {value:4, label:'4. April (Apr)'}, {value:5, label:'5. May (May)'}, {value:6, label:'6. June (Jun)'},
        {value:7, label:'7. July (Jul)'}, {value:8, label:'8. August (Aug)'}, {value:9, label:'9. September (Sep)'},
        {value:10, label:'10. October (Oct)'}, {value:11, label:'11. November (Nov)'}, {value:12, label:'12. December (Dec)'}
    ],
    years: (start, count) => Array.from({length:count}, (_,i) => ({ value: start+i, label: (start+i).toString() }))
};

// =========================================================
// 2. INVOCATION LOGIC
// =========================================================
function openMyDatePicker() {
    const today = new Date();
    const currYear = today.getFullYear();
    
    openRolodex("Select Date",[
        { id: 'day', items: RoloGen.days31(), selectedValue: today.getDate() },
        { id: 'month', items: RoloGen.monthsSpec(), selectedValue: today.getMonth() + 1, flex: 1.8 }, // flex: 1.8 makes the month column wider
        { id: 'year', items: RoloGen.years(currYear, 10), selectedValue: currYear }
    ], (res) => {
        // Callback when user hits "Set"
        const year = parseInt(res.year);
        const month = parseInt(res.month) - 1; // JS months are 0-indexed
        const day = parseInt(res.day);
        
        const selectedDate = new Date(year, month, day);
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        
        // Output result to screen
        document.getElementById('date-output').innerText = selectedDate.toLocaleDateString('en-GB', options);
    });
}

// =========================================================
// 3. THE PHYSICS ENGINE (DO NOT MODIFY)
// =========================================================
function openRolodex(title, columns, onSaveCallback) {
    let existing = document.getElementById('rolodex-modal');
    if (existing) existing.remove();

    const backdrop = document.createElement('div');
    backdrop.id = 'rolodex-modal';
    backdrop.className = 'bottom-sheet-backdrop';
    
    let colsHtml = '';
    columns.forEach(col => {
        let itemsHtml = '';
        col.items.forEach(item => {
            itemsHtml += `<div class="rolodex-item" data-value="${item.value}">${item.label}</div>`;
        });
        
        colsHtml += `
            <div class="rolodex-col-wrapper" style="flex: ${col.flex || 1}">
                <div class="rolodex-col" id="rolo-col-${col.id}">
                    <div class="rolodex-col-inner" id="rolo-track-${col.id}">
                        ${itemsHtml}
                    </div>
                </div>
            </div>
        `;
    });

    backdrop.innerHTML = `
        <div class="rolodex-sheet">
            <div class="rolodex-header">
                <span class="rolodex-cancel" onclick="closeRolodex()">Cancel</span>
                <span class="rolodex-title">${title}</span>
                <span class="rolodex-save" id="rolo-save-btn">Set</span>
            </div>
            <div class="rolodex-body">
                <div class="rolodex-highlight"></div>
                ${colsHtml}
            </div>
        </div>
    `;

    document.body.appendChild(backdrop);
    
    requestAnimationFrame(() => {
        backdrop.classList.add('show');
        backdrop.querySelector('.rolodex-sheet').classList.add('show');
    });

    const results = {};

    columns.forEach(col => {
        const colDiv = document.getElementById(`rolo-col-${col.id}`);
        const track = document.getElementById(`rolo-track-${col.id}`);
        const itemHeight = 44; 
        const maxIndex = col.items.length - 1;
        
        let targetIndex = col.items.findIndex(i => i.value == col.selectedValue);
        if (targetIndex === -1) targetIndex = 0;

        let currentY = -targetIndex * itemHeight;
        track.style.transform = `translateY(${currentY}px)`;
        updateActive(targetIndex);

        let isDragging = false;
        let startY = 0;
        let startTransformY = 0;
        let wheelAccumulator = 0;

        function getClientY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

        function onStart(e) {
            isDragging = true;
            startY = getClientY(e);
            startTransformY = currentY;
            track.style.transition = 'none'; 
        }

        function onMove(e) {
            if (!isDragging) return;
            e.preventDefault(); 
            
            const delta = getClientY(e) - startY;
            let newY = startTransformY + delta;

            const boundsTop = 0;
            const boundsBottom = -maxIndex * itemHeight;
            if (newY > boundsTop) newY = boundsTop + (newY - boundsTop) * 0.3;
            if (newY < boundsBottom) newY = boundsBottom + (newY - boundsBottom) * 0.3;

            currentY = newY;
            track.style.transform = `translateY(${currentY}px)`;

            let tempIndex = Math.round(-currentY / itemHeight);
            tempIndex = Math.max(0, Math.min(tempIndex, maxIndex));
            
            if (tempIndex !== targetIndex) {
                targetIndex = tempIndex;
                if (navigator.vibrate) navigator.vibrate(30); // Haptic feedback
                updateActive(targetIndex);
            }
        }

        function onEnd() {
            if (!isDragging) return;
            isDragging = false;
            
            targetIndex = Math.round(-currentY / itemHeight);
            targetIndex = Math.max(0, Math.min(targetIndex, maxIndex));
            
            currentY = -targetIndex * itemHeight;
            track.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
            track.style.transform = `translateY(${currentY}px)`;
            updateActive(targetIndex);
        }

        colDiv.addEventListener('wheel', (e) => {
            e.preventDefault();
            wheelAccumulator += e.deltaY;
            if (Math.abs(wheelAccumulator) >= 30) { 
                let direction = Math.sign(wheelAccumulator);
                let newIndex = targetIndex + direction;
                newIndex = Math.max(0, Math.min(newIndex, maxIndex));
                
                if (newIndex !== targetIndex) {
                    targetIndex = newIndex;
                    currentY = -targetIndex * itemHeight;
                    track.style.transition = 'transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    track.style.transform = `translateY(${currentY}px)`;
                    if (navigator.vibrate) navigator.vibrate(30);
                    updateActive(targetIndex);
                }
                wheelAccumulator = 0;
            }
        }, {passive: false});

        colDiv.addEventListener('touchstart', onStart, {passive: false});
        colDiv.addEventListener('touchmove', onMove, {passive: false});
        colDiv.addEventListener('touchend', onEnd);
        colDiv.addEventListener('touchcancel', onEnd);
        
        colDiv.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove, {passive: false});
        window.addEventListener('mouseup', onEnd);

        function updateActive(index) {
            Array.from(track.children).forEach((child, i) => {
                if (i === index) {
                    child.classList.add('active');
                    results[col.id] = child.dataset.value;
                } else {
                    child.classList.remove('active');
                }
            });
        }
    });

    document.getElementById('rolo-save-btn').addEventListener('click', () => {
        onSaveCallback(results);
        closeRolodex();
    });
}

function closeRolodex() {
    const modal = document.getElementById('rolodex-modal');
    if (modal) {
        modal.classList.remove('show');
        modal.querySelector('.rolodex-sheet').classList.remove('show');
        setTimeout(() => modal.remove(), 300);
    }
}
</script>
</body>
</html>
